version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: securesphere-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - securesphere-network
    restart: unless-stopped

  gateway:
    build: .
    container_name: securesphere-gateway
    command: uvicorn gateway.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - MONGODB_URI=mongodb://mongodb:27017
    depends_on:
      - mongodb
    networks:
      - securesphere-network
    restart: unless-stopped

  dashboard:
    build: .
    container_name: securesphere-dashboard
    command: streamlit run dashboard/app.py --server.port=8501 --server.address=0.0.0.0
    ports:
      - "8501:8501"
    env_file:
      - .env
    environment:
      - MONGODB_URI=mongodb://mongodb:27017
    depends_on:
      - gateway
    networks:
      - securesphere-network
    restart: unless-stopped

networks:
  securesphere-network:
    driver: bridge

volumes:
  mongo_data:
